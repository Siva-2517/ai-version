name: NOVA AI - CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/nova-ai
  CONTAINER_NAME: nova-ai

jobs:

  # ============================================================
  # CI - TEST
  # ============================================================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check index.html
        run: |
          echo "Checking index.html..."

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          echo "index.html found."

      - name: Validate HTML
        run: |
          echo "Validating HTML..."

          grep -qi "<!DOCTYPE html>" index.html
          grep -qi "<html" index.html
          grep -qi "<head" index.html
          grep -qi "<body" index.html
          grep -qi "</html>" index.html

          echo "HTML validation successful."


  # ============================================================
  # CI - BUILD DOCKER IMAGE
  # ============================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Create Dockerfile
      # --------------------------------------------------------
      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<'EOF'

          FROM nginx:alpine

          # Remove default nginx website
          RUN rm -rf /usr/share/nginx/html/*

          # Copy our application
          COPY index.html /usr/share/nginx/html/index.html

          # Expose nginx port
          EXPOSE 80

          # Run nginx in foreground
          CMD ["nginx", "-g", "daemon off;"]

          EOF

          echo "Dockerfile created."

      - name: Display Dockerfile
        run: |
          cat Dockerfile

      # --------------------------------------------------------
      # Login Docker Hub
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # --------------------------------------------------------
      # Build image
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${GITHUB_SHA::7} \
            .

          echo "Docker image built successfully."

      # --------------------------------------------------------
      # Run container for testing
      # --------------------------------------------------------
      - name: Test Docker image
        run: |

          docker run -d \
            --name nova-test \
            -p 8080:80 \
            $IMAGE_NAME:latest

          echo "Waiting for nginx..."
          sleep 5

          echo "Testing application..."

          curl --fail http://localhost:8080

          echo "Application test successful."

          docker stop nova-test
          docker rm nova-test

      # --------------------------------------------------------
      # Push latest image
      # --------------------------------------------------------
      - name: Push latest image
        run: |
          docker push $IMAGE_NAME:latest

          echo "Latest image pushed."

      # --------------------------------------------------------
      # Push versioned image
      # --------------------------------------------------------
      - name: Push versioned image
        run: |
          docker push $IMAGE_NAME:${GITHUB_SHA::7}

          echo "Versioned image pushed."


  # ============================================================
  # CD - DEPLOY TO EC2
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |

            echo "======================================"
            echo "NOVA deployment started"
            echo "======================================"

            # --------------------------------------------------
            # Check Docker
            # --------------------------------------------------

            echo "Checking Docker..."

            docker --version

            # --------------------------------------------------
            # Login to Docker Hub
            # --------------------------------------------------

            echo "Logging into Docker Hub..."

            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | \
              docker login \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

            echo "Docker Hub login successful."

            # --------------------------------------------------
            # Pull latest image
            # --------------------------------------------------

            echo "Pulling latest NOVA image..."

            docker pull \
              ${{ secrets.DOCKERHUB_USERNAME }}/nova-ai:latest

            echo "Image pulled successfully."

            # --------------------------------------------------
            # Stop old container
            # --------------------------------------------------

            echo "Stopping old container..."

            docker stop nova-ai 2>/dev/null || true

            # --------------------------------------------------
            # Remove old container
            # --------------------------------------------------

            echo "Removing old container..."

            docker rm nova-ai 2>/dev/null || true

            # --------------------------------------------------
            # Start new container
            # --------------------------------------------------

            echo "Starting new container..."

            docker run -d \
              --name nova-ai \
              --restart unless-stopped \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/nova-ai:latest

            # --------------------------------------------------
            # Wait for application
            # --------------------------------------------------

            echo "Waiting for application..."

            sleep 5

            # --------------------------------------------------
            # Check container
            # --------------------------------------------------

            echo "Checking container status..."

            docker ps

            # --------------------------------------------------
            # Test application
            # --------------------------------------------------

            echo "Testing nginx..."

            curl --fail http://localhost

            echo "======================================"
            echo "NOVA deployed successfully!"
            echo "======================================"

            echo "Running containers:"
            docker ps

            echo "Deployment completed."