name: NOVA AI - CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/nova-ai
  CONTAINER_NAME: nova-ai

jobs:

  # ============================================================
  # CI - TEST APPLICATION
  # ============================================================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check index.html
        run: |
          echo "======================================"
          echo "Checking index.html"
          echo "======================================"

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          echo "index.html found."

      - name: Validate HTML
        run: |
          echo "======================================"
          echo "Validating HTML"
          echo "======================================"

          grep -qi "<!DOCTYPE html>" index.html
          grep -qi "<html" index.html
          grep -qi "<head" index.html
          grep -qi "<body" index.html
          grep -qi "</html>" index.html

          echo "HTML validation successful."


  # ============================================================
  # CI - BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Create Dockerfile
      # --------------------------------------------------------

      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM nginx:alpine

          RUN rm -rf /usr/share/nginx/html/*

          COPY index.html /usr/share/nginx/html/index.html

          EXPOSE 80

          CMD ["nginx", "-g", "daemon off;"]
          EOF

          echo "Dockerfile created."

      # --------------------------------------------------------
      # Display Dockerfile
      # --------------------------------------------------------

      - name: Display Dockerfile
        run: |
          echo "======================================"
          echo "Dockerfile"
          echo "======================================"

          cat Dockerfile

      # --------------------------------------------------------
      # Verify Docker Hub Secrets
      # --------------------------------------------------------

      - name: Verify Docker Hub secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          echo "======================================"
          echo "Checking Docker Hub credentials"
          echo "======================================"

          if [ -z "$DOCKER_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is empty"
            exit 1
          fi

          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "ERROR: DOCKERHUB_PASSWORD is empty"
            exit 1
          fi

          echo "Docker Hub username configured."
          echo "Docker Hub token configured."
          echo "Token length: ${#DOCKER_PASSWORD}"

      # --------------------------------------------------------
      # Login Docker Hub
      # --------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # --------------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          echo "======================================"
          echo "Building Docker image"
          echo "======================================"

          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${GITHUB_SHA::7} \
            .

          echo "Docker image built successfully."

      # --------------------------------------------------------
      # Test Docker Image
      # --------------------------------------------------------

      - name: Test Docker image
        run: |
          echo "======================================"
          echo "Testing Docker container"
          echo "======================================"

          docker run -d \
            --name nova-test \
            -p 8080:80 \
            $IMAGE_NAME:latest

          echo "Waiting for Nginx..."
          sleep 5

          echo "Testing application..."

          curl --fail http://localhost:8080

          echo ""
          echo "Application test successful."

          docker stop nova-test
          docker rm nova-test

      # --------------------------------------------------------
      # Push Latest Image
      # --------------------------------------------------------

      - name: Push latest image
        run: |
          echo "======================================"
          echo "Pushing latest image"
          echo "======================================"

          docker push $IMAGE_NAME:latest

          echo "Latest image pushed successfully."

      # --------------------------------------------------------
      # Push Versioned Image
      # --------------------------------------------------------

      - name: Push versioned image
        run: |
          echo "======================================"
          echo "Pushing versioned image"
          echo "======================================"

          docker push $IMAGE_NAME:${GITHUB_SHA::7}

          echo "Versioned image pushed successfully."


  # ============================================================
  # CD - DEPLOY TO EC2
  # ============================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:

      # --------------------------------------------------------
      # SSH INTO EC2
      # --------------------------------------------------------

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |

            set -e

            echo "======================================"
            echo "NOVA AI DEPLOYMENT"
            echo "======================================"

            # --------------------------------------------------
            # Configuration
            # --------------------------------------------------

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/nova-ai:latest"
            CONTAINER="nova-ai"

            echo "Image: $IMAGE"
            echo "Container: $CONTAINER"

            # --------------------------------------------------
            # Check Docker
            # --------------------------------------------------

            echo ""
            echo "Checking Docker..."

            docker --version

            # --------------------------------------------------
            # Login to Docker Hub
            # --------------------------------------------------

            echo ""
            echo "Logging into Docker Hub..."

            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | \
              docker login docker.io \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

            echo "Docker Hub login successful."

            # --------------------------------------------------
            # Pull Latest Image
            # --------------------------------------------------

            echo ""
            echo "Pulling latest NOVA AI image..."

            docker pull "$IMAGE"

            echo "Image pulled successfully."

            # --------------------------------------------------
            # Stop Existing Container
            # --------------------------------------------------

            echo ""
            echo "Stopping existing container..."

            docker stop "$CONTAINER" 2>/dev/null || true

            # --------------------------------------------------
            # Remove Existing Container
            # --------------------------------------------------

            echo ""
            echo "Removing existing container..."

            docker rm "$CONTAINER" 2>/dev/null || true

            # --------------------------------------------------
            # Start New Container
            # --------------------------------------------------

            echo ""
            echo "Starting new container..."

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"

            echo "New container started."

            # --------------------------------------------------
            # Wait for Nginx
            # --------------------------------------------------

            echo ""
            echo "Waiting for application..."

            sleep 5

            # --------------------------------------------------
            # Check Container
            # --------------------------------------------------

            echo ""
            echo "Checking container status..."

            docker ps --filter "name=$CONTAINER"

            # --------------------------------------------------
            # Check Container Is Running
            # --------------------------------------------------

            if ! docker ps --format '{{.Names}}' | grep -q "^${CONTAINER}$"; then
              echo "ERROR: Container is not running."

              echo ""
              echo "Container logs:"
              docker logs "$CONTAINER"

              exit 1
            fi

            echo "Container is running."

            # --------------------------------------------------
            # Test Application
            # --------------------------------------------------

            echo ""
            echo "Testing Nginx..."

            curl --fail http://localhost

            echo ""
            echo "Application is responding successfully."

            # --------------------------------------------------
            # Cleanup Old Docker Images
            # --------------------------------------------------

            echo ""
            echo "Cleaning unused Docker images..."

            docker image prune -f

            # --------------------------------------------------
            # Logout Docker Hub
            # --------------------------------------------------

            echo ""
            echo "Logging out of Docker Hub..."

            docker logout docker.io || true

            # --------------------------------------------------
            # Final Status
            # --------------------------------------------------

            echo ""
            echo "======================================"
            echo "NOVA AI DEPLOYMENT SUCCESSFUL"
            echo "======================================"

            echo ""
            echo "Running containers:"

            docker ps

            echo ""
            echo "Deployment completed successfully."