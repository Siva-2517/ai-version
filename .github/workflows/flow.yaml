name: NOVA AI - CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/nova-ai
  CONTAINER_NAME: nova-ai

jobs:

  # ============================================================
  # CI - TEST
  # ============================================================

  test:
    name: Test Application
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check index.html
        run: |
          test -f index.html
          echo "index.html found."

      - name: Validate HTML
        run: |
          grep -qi "<!DOCTYPE html>" index.html
          grep -qi "<html" index.html
          grep -qi "<head" index.html
          grep -qi "<body" index.html
          grep -qi "</html>" index.html

          echo "HTML validation successful."


  # ============================================================
  # BUILD + PUSH
  # ============================================================

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: test

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # --------------------------------------------------------
      # Create Dockerfile
      # --------------------------------------------------------

      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM nginx:alpine

          RUN rm -rf /usr/share/nginx/html/*

          COPY index.html /usr/share/nginx/html/index.html

          EXPOSE 80

          CMD ["nginx", "-g", "daemon off;"]
          EOF

      # --------------------------------------------------------
      # Docker information
      # --------------------------------------------------------

      - name: Docker version
        run: |
          docker --version
          docker info

      # --------------------------------------------------------
      # Docker Hub login
      # --------------------------------------------------------

      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKERHUB_USERNAME is empty"
            exit 1
          fi

          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "DOCKERHUB_PASSWORD is empty"
            exit 1
          fi

          echo "Logging into Docker Hub..."

          printf '%s' "$DOCKER_PASSWORD" | \
            docker login docker.io \
            --username "$DOCKER_USERNAME" \
            --password-stdin

          echo "Docker Hub login successful."

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${GITHUB_SHA::7}" \
            .

          echo "Docker image built."

      # --------------------------------------------------------
      # Test container
      # --------------------------------------------------------

      - name: Test Docker image
        run: |
          docker run -d \
            --name nova-test \
            -p 8080:80 \
            "$IMAGE_NAME:latest"

          sleep 5

          curl --fail http://localhost:8080

          echo ""
          echo "Docker container test successful."

          docker stop nova-test
          docker rm nova-test

      # --------------------------------------------------------
      # Push latest
      # --------------------------------------------------------

      - name: Push latest image
        run: |
          docker push "$IMAGE_NAME:latest"

      # --------------------------------------------------------
      # Push version
      # --------------------------------------------------------

      - name: Push versioned image
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA::7}"

      # --------------------------------------------------------
      # Logout
      # --------------------------------------------------------

      - name: Logout Docker Hub
        run: |
          docker logout docker.io || true


  # ============================================================
  # DEPLOY TO EC2
  # ============================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04
    needs: build

    steps:

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |

            set -e

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/nova-ai:latest"
            CONTAINER="nova-ai"

            echo "======================================"
            echo "NOVA AI DEPLOYMENT"
            echo "======================================"

            # --------------------------------------------------
            # Docker check
            # --------------------------------------------------

            echo "Docker version:"
            docker --version

            # --------------------------------------------------
            # Login Docker Hub
            # --------------------------------------------------

            echo "Logging into Docker Hub..."

            printf '%s' '${{ secrets.DOCKERHUB_PASSWORD }}' | \
              docker login docker.io \
              --username '${{ secrets.DOCKERHUB_USERNAME }}' \
              --password-stdin

            echo "Docker Hub login successful."

            # --------------------------------------------------
            # Pull latest image
            # --------------------------------------------------

            echo "Pulling image:"
            echo "$IMAGE"

            docker pull "$IMAGE"

            # --------------------------------------------------
            # Stop old container
            # --------------------------------------------------

            echo "Stopping old container..."

            docker stop "$CONTAINER" 2>/dev/null || true

            # --------------------------------------------------
            # Remove old container
            # --------------------------------------------------

            echo "Removing old container..."

            docker rm "$CONTAINER" 2>/dev/null || true

            # --------------------------------------------------
            # Start new container
            # --------------------------------------------------

            echo "Starting new container..."

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"

            # --------------------------------------------------
            # Wait
            # --------------------------------------------------

            echo "Waiting for Nginx..."

            sleep 5

            # --------------------------------------------------
            # Container check
            # --------------------------------------------------

            if ! docker ps --format '{{.Names}}' | grep -q "^${CONTAINER}$"; then

              echo "ERROR: Container failed to start."

              echo "Container logs:"
              docker logs "$CONTAINER" || true

              exit 1

            fi

            echo "Container is running."

            # --------------------------------------------------
            # Application test
            # --------------------------------------------------

            echo "Testing application..."

            curl --fail http://localhost

            echo ""
            echo "NOVA AI is responding successfully."

            # --------------------------------------------------
            # Cleanup
            # --------------------------------------------------

            docker image prune -f

            # --------------------------------------------------
            # Logout
            # --------------------------------------------------

            docker logout docker.io || true

            echo ""
            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"

            docker ps