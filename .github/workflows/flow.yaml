name: NOVA AI - CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/nova-ai
  CONTAINER_NAME: nova-ai

jobs:

  # ============================================================
  # CI - TEST
  # ============================================================

  test:
    name: Test Application
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check index.html
        run: |
          echo "======================================"
          echo "Checking index.html"
          echo "======================================"

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          echo "index.html found."

      - name: Validate HTML
        run: |
          echo "Validating HTML..."

          grep -qi "<!DOCTYPE html>" index.html
          grep -qi "<html" index.html
          grep -qi "<head" index.html
          grep -qi "<body" index.html
          grep -qi "</html>" index.html

          echo "HTML validation successful."


  # ============================================================
  # BUILD + PUSH DOCKER IMAGE
  # ============================================================

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: test

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # --------------------------------------------------------
      # Create Dockerfile
      # --------------------------------------------------------

      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM nginx:alpine

          RUN rm -rf /usr/share/nginx/html/*

          COPY index.html /usr/share/nginx/html/index.html

          EXPOSE 80

          CMD ["nginx", "-g", "daemon off;"]
          EOF

          echo "Dockerfile created."

      # --------------------------------------------------------
      # Docker Login
      # --------------------------------------------------------

      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is empty"
            exit 1
          fi

          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "ERROR: DOCKERHUB_PASSWORD is empty"
            exit 1
          fi

          echo "Logging into Docker Hub..."

          printf '%s' "$DOCKER_PASSWORD" | \
            docker login docker.io \
            --username "$DOCKER_USERNAME" \
            --password-stdin

          echo "Docker Hub login successful."

      # --------------------------------------------------------
      # Build Image
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${GITHUB_SHA::7}" \
            .

          echo "Docker image built successfully."

      # --------------------------------------------------------
      # Test Container
      # --------------------------------------------------------

      - name: Test Docker image
        run: |

          docker run -d \
            --name nova-test \
            -p 8080:80 \
            "$IMAGE_NAME:latest"

          echo "Waiting for Nginx..."
          sleep 5

          curl --fail http://localhost:8080

          echo ""
          echo "Application test successful."

          docker stop nova-test
          docker rm nova-test

      # --------------------------------------------------------
      # Push Latest
      # --------------------------------------------------------

      - name: Push latest image
        run: |
          docker push "$IMAGE_NAME:latest"

          echo "Latest image pushed."

      # --------------------------------------------------------
      # Push Version
      # --------------------------------------------------------

      - name: Push versioned image
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA::7}"

          echo "Versioned image pushed."

      # --------------------------------------------------------
      # Logout
      # --------------------------------------------------------

      - name: Logout Docker Hub
        run: |
          docker logout docker.io || true


  # ============================================================
  # CD - DEPLOY TO EC2
  # ============================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04
    needs: build

    steps:

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ========================================================
      # SSH DEPLOYMENT
      # ========================================================

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |

            set -e

            echo "======================================"
            echo "NOVA AI DEPLOYMENT"
            echo "======================================"

            # ==================================================
            # DETECT OPERATING SYSTEM
            # ==================================================

            echo ""
            echo "Detecting operating system..."

            if [ -f /etc/os-release ]; then
              . /etc/os-release

              echo "OS: $NAME"
              echo "VERSION: $VERSION"
            else
              echo "ERROR: Cannot detect operating system."
              exit 1
            fi


            # ==================================================
            # CHECK / INSTALL DOCKER
            # ==================================================

            echo ""
            echo "Checking Docker..."

            if command -v docker >/dev/null 2>&1; then

              echo "Docker is already installed."
              docker --version

            else

              echo "Docker is not installed."
              echo "Installing Docker..."

              # ----------------------------------------------
              # Ubuntu / Debian
              # ----------------------------------------------

              if command -v apt-get >/dev/null 2>&1; then

                echo "Detected Debian/Ubuntu."

                sudo apt-get update

                sudo apt-get install -y docker.io

                sudo systemctl enable docker
                sudo systemctl start docker

              # ----------------------------------------------
              # Amazon Linux / RHEL / CentOS
              # ----------------------------------------------

              elif command -v dnf >/dev/null 2>&1; then

                echo "Detected dnf-based system."

                sudo dnf install -y docker

                sudo systemctl enable docker
                sudo systemctl start docker

              elif command -v yum >/dev/null 2>&1; then

                echo "Detected yum-based system."

                sudo yum install -y docker

                sudo systemctl enable docker
                sudo systemctl start docker

              else

                echo "ERROR: Unsupported Linux distribution."
                exit 1

              fi

              echo "Docker installation completed."

            fi


            # ==================================================
            # ENSURE DOCKER SERVICE IS RUNNING
            # ==================================================

            echo ""
            echo "Starting Docker service..."

            sudo systemctl enable docker || true
            sudo systemctl start docker

            sleep 3

            echo ""
            echo "Docker version:"

            docker --version


            # ==================================================
            # DOCKER PERMISSION
            # ==================================================

            echo ""
            echo "Checking Docker permissions..."

            if docker ps >/dev/null 2>&1; then

              echo "Docker works without sudo."

            else

              echo "Adding current user to Docker group..."

              sudo usermod -aG docker "$USER" || true

              # Refresh group for this SSH session
              if command -v newgrp >/dev/null 2>&1; then
                echo "Refreshing Docker group..."
              fi

            fi


            # ==================================================
            # DOCKER HUB LOGIN
            # ==================================================

            echo ""
            echo "Logging into Docker Hub..."

            printf '%s' '${{ secrets.DOCKERHUB_PASSWORD }}' | \
              sudo docker login docker.io \
              --username '${{ secrets.DOCKERHUB_USERNAME }}' \
              --password-stdin

            echo "Docker Hub login successful."


            # ==================================================
            # CONFIGURATION
            # ==================================================

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/nova-ai:latest"
            CONTAINER="nova-ai"

            echo ""
            echo "Image: $IMAGE"
            echo "Container: $CONTAINER"


            # ==================================================
            # PULL IMAGE
            # ==================================================

            echo ""
            echo "Pulling latest Docker image..."

            sudo docker pull "$IMAGE"

            echo "Image pulled successfully."


            # ==================================================
            # STOP OLD CONTAINER
            # ==================================================

            echo ""
            echo "Stopping old container..."

            sudo docker stop "$CONTAINER" 2>/dev/null || true


            # ==================================================
            # REMOVE OLD CONTAINER
            # ==================================================

            echo ""
            echo "Removing old container..."

            sudo docker rm "$CONTAINER" 2>/dev/null || true


            # ==================================================
            # START NEW CONTAINER
            # ==================================================

            echo ""
            echo "Starting new container..."

            sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"

            echo "New container started."


            # ==================================================
            # WAIT FOR NGINX
            # ==================================================

            echo ""
            echo "Waiting for Nginx..."

            sleep 5


            # ==================================================
            # CHECK CONTAINER
            # ==================================================

            echo ""
            echo "Checking container..."

            if ! sudo docker ps \
              --format '{{.Names}}' | \
              grep -q "^${CONTAINER}$"; then

              echo "ERROR: Container failed to start."

              echo ""
              echo "Container logs:"

              sudo docker logs "$CONTAINER" || true

              exit 1

            fi

            echo "Container is running."


            # ==================================================
            # TEST APPLICATION
            # ==================================================

            echo ""
            echo "Testing application..."

            curl --fail http://localhost

            echo ""
            echo "NOVA AI is responding successfully."


            # ==================================================
            # CLEAN OLD IMAGES
            # ==================================================

            echo ""
            echo "Cleaning unused Docker images..."

            sudo docker image prune -f


            # ==================================================
            # LOGOUT
            # ==================================================

            echo ""
            echo "Logging out of Docker Hub..."

            sudo docker logout docker.io || true


            # ==================================================
            # FINAL STATUS
            # ==================================================

            echo ""
            echo "======================================"
            echo "NOVA AI DEPLOYMENT SUCCESSFUL"
            echo "======================================"

            echo ""
            echo "Running containers:"

            sudo docker ps

            echo ""
            echo "Deployment completed successfully."